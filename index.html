<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ตารางทำงานประจำวัน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #f9f9f9;
    }
    img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h2>📅 ตารางทำงานวันนี้</h2>
  <div id="content">กำลังโหลด...</div>
  
  <hr style="margin:30px 0;">
  
  <h3>🔐 ดูตารางส่วนบุคคล</h3>
  <input type="text" id="empCode" placeholder="รหัสพนักงาน"><br><br>
  <input type="password" id="password" placeholder="รหัสผ่าน"><br><br>
  <button onclick="checkLogin()">เข้าสู่ระบบ</button>
  <div id="privateLink" style="margin-top:20px;"></div>
  
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzo7RRFgDq0wCmscDj3KK9widCbndKSlVVQbSSBqW23osItAOCoNBfAXKglr9Qb8MNVqw/exec"; // ใส่ URL จาก Google Apps Script

    async function loadImage() {
      try {
        let res = await fetch(API_URL);
        let data = await res.json();

        if (data.image) {
          document.getElementById("content").innerHTML =
            `<p>
              วันที่: ${data.date} <br><br>
          
              <a href="${data.image}" target="_blank">📅 ดูตารางวันนี้</a>
              
              <br><br>
          
              <a href="${data.nextImage}" target="_blank">➡️ ดูตารางวันถัดไป</a>
            </p>`;
        } else {
          document.getElementById("content").innerHTML = "❌ ไม่มีไฟล์สำหรับวันนี้";
        }
      } catch (err) {
        document.getElementById("content").innerHTML = "⚠️ โหลดข้อมูลผิดพลาด";
      }
    }

    loadImage();

    async function checkLogin() {
      const code = document.getElementById("empCode").value;
      const pass = document.getElementById("password").value;
  
      if (!code || !pass) {
        alert("กรุณากรอกข้อมูล");
        return;
      }
  
      try {
        let res = await fetch(API_URL + "?mode=private&code=" + code + "&pass=" + pass);
        let data = await res.json();
  
        if (data.privateImage) {
          document.getElementById("privateLink").innerHTML =
            `<a href="${data.privateImage}" target="_blank">👤 ดูตารางของคุณ</a>`;
        } else {
          document.getElementById("privateLink").innerHTML =
            "❌ รหัสไม่ถูกต้อง หรือไม่มีข้อมูล";
        }
  
      } catch (err) {
        document.getElementById("privateLink").innerHTML = "⚠️ เกิดข้อผิดพลาด";
      }
    }
  </script>
</body>
</html>
