<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Daily Calendar V1.0.8</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #f9f9f9;
    }
    img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h2>📅 Today Calendar</h2>
  <div id="content">⏳ Loading...</div>
  
  <hr style="margin:30px 0;">
  
  <h3>🔐 Personal Calendar</h3>
  <input type="text" id="empCode" placeholder="Staff ID"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="checkLogin()">Login</button>
  <div id="privateLink" style="margin-top:20px;"></div>

  <div id="loadingOverlay" style="
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
    color:white;
    font-size:20px;
    justify-content:center;
    align-items:center;
    z-index:9999;
  ">
    ⏳ Loading...
  </div>
  
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyS585c2aXw3RXEOM6-IS5VNKopge6c7na97cSaMwzham7IVIjm2_YpdmFTV7MyndAL/exec";

    // ✅ โหลดตารางวันนี้
    async function loadImage() {
      try {
        let res = await fetch(API_URL);
        let data = await res.json();

        if (data.image) {
          document.getElementById("content").innerHTML =
            `<p>
              Today: ${data.date} <br><br>
              <a href="${data.image}" target="_blank">📅 View Today Calendar</a>
              <br><br>
              <a href="${data.nextImage}" target="_blank">➡️ View Next day Calendar</a>
            </p>`;
        } else {
          document.getElementById("content").innerHTML = "❌ No file for today";
        }
      } catch (err) {
        document.getElementById("content").innerHTML = "⚠️ Fail to download";
      }
    }

    loadImage();

    // ✅ login (fetch ปกติ)
    async function checkLogin() {
      const code = document.getElementById("empCode").value.trim();
      const pass = document.getElementById("password").value.trim();
    
      if (!code || !pass) {
        alert("⚠️ Please input data");
        return;
      }
    
      const overlay = document.getElementById("loadingOverlay");
      overlay.style.display = "flex";
    
      try {
        let res = await fetch(API_URL + "?mode=private&staffId=" + encodeURIComponent(code) + "&pass=" + encodeURIComponent(pass));
        let data = await res.json();
    
        if (data.privateImages && data.privateImages.length > 0) {
          let html = "";
          data.privateImages.forEach(item => {
            html += `
              <div style="margin-bottom:10px;">
                📅 ${item.month} <br>
                <a href="${item.url}" target="_blank">View Personal Calendar</a>
              </div>
            `;
          });
          document.getElementById("privateLink").innerHTML = html;
        } else {
          document.getElementById("privateLink").innerHTML =
            "❌ Incorrect StaffID or Password";
        }
    
      } catch (err) {
        document.getElementById("privateLink").innerHTML = "⚠️ Fail";
      }
    
      overlay.style.display = "none";
    }
  </script>
</body>
</html>
